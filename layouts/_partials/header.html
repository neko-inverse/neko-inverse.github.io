<header class="header">
    <nav class="header-nav">
        <div class="logo">
            <a href="{{ "" | absLangURL }}" accesskey="h" title="{{ site.Title }} (Alt + H)">
                <svg class="brand-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect width="32" height="32" rx="3" fill="currentColor"></rect>
                    <path d="M5 23 12.5 12 17 18 21 10 27 23H5Z" stroke="#fff8ef" stroke-width="1.8" stroke-linejoin="round"></path>
                    <path d="m10 15 2.5 2 2.5-2M19 14l2 1.5L23 14" stroke="#fff8ef" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                {{ site.Title }}
            </a>
            {{- if not site.Params.disableThemeToggle }}
            <div class="logo-switches">
                <button id="theme-toggle" class="theme-toggle" accesskey="t" title="切换明暗主题 (Alt + T)" aria-label="切换明暗主题">
                    <span class="moon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 19 6-10 4 5 3-7 5 12H3Z"></path>
                            <path d="m7 12 2 2 2-2m4-1 1.5 1.5L18 11"></path>
                        </svg>
                    </span>
                    <span class="sun" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                            <path d="M3 6c3-2 5 2 9 0s6 2 9 0M3 12c3-2 5 2 9 0s6 2 9 0M3 18c3-2 5 2 9 0s6 2 9 0"></path>
                        </svg>
                    </span>
                </button>
            </div>
            {{- end }}
        </div>
        {{- $page_url := .Permalink | absLangURL }}
        <ul id="menu" class="menu">
            {{- range site.Menus.main }}
            {{- $menu_item_url := (cond (strings.HasSuffix .URL "/") .URL (printf "%s/" .URL)) | absLangURL }}
            <li>
                <a href="{{ .URL | absLangURL }}" title="{{ .Title | default .Name }}">
                    <span {{- if eq $menu_item_url $page_url }} class="active" {{- end }}>{{ .Name }}</span>
                </a>
            </li>
            {{- end }}
        </ul>
    </nav>
</header>
